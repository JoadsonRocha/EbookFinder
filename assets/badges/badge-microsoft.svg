<svg xmlns="http://www.w3.org/2000/svg" width="215" height="64" viewBox="0 0 215 64" fill="none">
  <!-- Fundo Estilo Microsoft Store Oficial -->
  <rect x="1" y="1" width="213" height="62" rx="10" fill="#000000" stroke="#A6A6A6" stroke-width="1.2"/>

  <!-- Logo 4 Quadrantes Windows -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="12.5" height="12.5" fill="#F25022"/>
    <rect x="15" y="0" width="12.5" height="12.5" fill="#7FBA00"/>
    <rect x="0" y="15" width="12.5" height="12.5" fill="#00A4EF"/>
    <rect x="15" y="15" width="12.5" height="12.5" fill="#FFB900"/>
  </g>

  <!-- Texto Microsoft Store -->
  <text x="60" y="24" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1">DISPONÍVEL NA</text>
  <text x="60" y="47" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="0.2">Microsoft</text>
</svg>
